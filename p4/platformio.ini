; MA8: ES7210 x2 8ch simultaneous sampling - M5Stack Stamp-P4 (ESP32-P4, Arduino 3.x)
; https://docs.platformio.org/page/projectconf.html
;
;   pio run -d p4 -t upload                 ; chip revision < v3.0 (ESP32-P4 "ES", default)
;   pio run -d p4 -e stamp-p4-r3 -t upload  ; chip revision v3.x
;   (the revision is printed by esptool at upload: "Chip is ESP32-P4 (revision vX.Y)")
;
; Upload / boot log: on-board USB-C (USB Serial/JTAG).
; USB Audio (UAC2) + CDC (Serial): USB2 OTG HS pads (USB2_HOST_DP / USB2_HOST_DM).
;
; core_dir: the pioarduino platform installs its own PlatformIO fork into the core's Python
; environment and replaces shared packages. It is kept away from ~/.platformio so that the
; StampS3 build (espressif32@6.13.0) and other projects are not affected.

[platformio]
core_dir = ~/.platformio-pioarduino
src_dir = ../src
include_dir = ../include
default_envs = stamp-p4

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.variants_dir = variants
board_build.variant = m5stack_stamp_p4
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter = +<*> -<s3/>
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DMA8_BOARD_STAMPP4

; ESP32-P4 chip revision < v3.0
[env:stamp-p4]
board = esp32-p4

; ESP32-P4 chip revision v3.x
[env:stamp-p4-r3]
board = esp32-p4_r3
