; MA8: ES7210 x2 8ch simultaneous sampling - M5StampS3 (ESP32-S3, Arduino 2.0.x, M5Unified)
; https://docs.platformio.org/page/projectconf.html
;
;   pio run -e m5stamps3 -t upload        ; M5StampS3 in M5Capsule
;
; The Stamp-P4 (ESP32-P4) build is a separate project in p4/ (it needs the pioarduino
; platform in its own core_dir):   pio run -d p4 -t upload
;
; USB is driven by TinyUSB (ARDUINO_USB_MODE=0): composite CDC (Serial) + USB Audio.
; If upload fails, hold the BOOT button (G0) while plugging in USB, then upload.

[platformio]
default_envs = m5stamps3

; M5StampS3 in M5Capsule (no PSRAM -> 128KB ring buffer in internal SRAM, SD = Capsule internal slot)
[env:m5stamps3]
platform = espressif32@6.13.0
framework = arduino
board = m5stack-stamps3
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified
build_src_filter = +<*> -<p4/>
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DMA8_BOARD_STAMPS3
